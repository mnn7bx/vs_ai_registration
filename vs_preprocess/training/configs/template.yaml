# Template registration model configuration

image_size: [96, 96, 96]
transform_type: affine

batch_size: 8
num_workers: 4
max_epochs: 300
lr: 1.0e-4
scheduler_T0: 50

similarity_loss: mi
mi_num_bins: 32
lambda_identity: 0.001
lambda_det: 0.1

patience: 30
val_fraction: 0.2
split_seed: 42
checkpoint_every_n_epochs: 10
