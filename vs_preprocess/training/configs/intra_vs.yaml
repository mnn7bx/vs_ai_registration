# VS intra-patient alignment

image_size: [128, 128, 128]
transform_type: affine

# Data
real_ratio: 0.5
synthetic_length_per_epoch: 1000
max_rotation_deg: 15.0
max_translation: 0.1
max_scale_offset: 0.05

# Training
batch_size: 4
num_workers: 4
max_epochs: 200
lr: 1.0e-4
grad_clip_norm: 1.0

# Scheduler
scheduler: plateau
plateau_factor: 0.5
plateau_patience: 10

# Model head
head_hidden: 512
head_dropout: 0.1

# Loss weights
similarity_loss: ncc
ncc_kernel_size: 9
lambda_sim: 1.0
lambda_identity: 0.01
lambda_det: 0.1
lambda_supervised: 0.5

# Supervised decay
lambda_supervised_decay: true
lambda_sup_decay_start: 30
lambda_sup_decay_end: 60

# Warm-up
warmup_start: 0
warmup_mi_start: 0
warmup_mi_end: 0

# Early stopping
patience: 40
val_fraction: 0.2
split_seed: 42

# Validation reproducibility
val_seed: 123

# Logging
checkpoint_every_n_epochs: 10
